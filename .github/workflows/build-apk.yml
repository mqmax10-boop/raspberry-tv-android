
name: Build Raspberry TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname 'RaspberryTV-Project-Supabase-Configured*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Prepare Android project
        run: |
          cd extracted/RaspberryTV-Project/RaspberryTV-Android

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper
          fi

          chmod +x gradlew

      - name: Build APK
        run: |
          cd extracted/RaspberryTV-Project/RaspberryTV-Android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raspberry-TV-APK
          path: extracted/RaspberryTV-Project/RaspberryTV-Android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
