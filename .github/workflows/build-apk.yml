
name: Build Raspberry TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Raspberry TV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'RaspberryTV-Project-Clever-Service-Fixed.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Check Android project
        run: |
          PROJECT_DIR="extracted/RaspberryTV-Project/RaspberryTV-Android"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android project not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Android app module not found"
            exit 1
          fi

          echo "Android project found successfully"

      - name: Build APK
        run: |
          gradle -p extracted/RaspberryTV-Project/RaspberryTV-Android \
            :app:assembleDebug \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raspberry-TV-APK
          path: extracted/RaspberryTV-Project/RaspberryTV-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
