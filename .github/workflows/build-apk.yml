
name: Build Raspberry TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Raspberry TV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 5 -type f \
            -name 'RaspberryTV-Fixed.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 5 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found project: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        shell: bash
        run: |
          GRADLE_FILE=$(find extracted -type f \
            -name 'settings.gradle*' -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Android settings.gradle not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raspberry-TV-APK
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
