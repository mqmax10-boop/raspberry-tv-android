
name: Build Raspberry TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Project
        run: |
          ZIP_FILE=$(find . -type f -iname 'RaspberryTV-Fixed-Player-Controls*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f -iname 'RaspberryTV-Fixed*.zip' -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            find . -type f -iname '*.zip'
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "ANDROID_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryTV-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
