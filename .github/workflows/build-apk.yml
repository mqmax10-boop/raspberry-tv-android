
name: Build Raspberry TV Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*Customer-Update*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -type f -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: gradle -p "$ANDROID_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raspberry-TV-Android-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
