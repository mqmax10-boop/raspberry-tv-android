
name: Build Raspberry TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname 'RaspberryTV-Fixed.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RaspberryTV-Fixed.zip not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "ANDROID_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaspberryTV-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
