
name: Build Raspberry TV Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RaspberryTV-Project-Android-Customer-Update.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: |
          unzip -q RaspberryTV-Project-Android-Customer-Update.zip -d project

      - name: Build Android APK
        run: |
          gradle -p project/RaspberryTV-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raspberry-TV-Android-APK
          path: project/RaspberryTV-Android/app/build/outputs/apk/debug/*.apk

